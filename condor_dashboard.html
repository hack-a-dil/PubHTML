<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPX Condor Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#080c14; --bg2:#0a0f1a; --bg3:#0d1420; --border:#1a2332;
  --text:#e2e8f0; --muted:#64748b; --dim:#475569; --vdim:#334155;
  --green:#34d399; --yellow:#fbbf24; --red:#f87171; --blue:#38bdf8;
  --purple:#818cf8; --orange:#fb923c;
  --font:'IBM Plex Mono','Courier New',monospace;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.pricebar{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.tabbar{background:var(--bg);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px;}
.content{padding:20px 24px;}
.footer{padding:10px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;margin-top:24px;}
.divider{width:1px;height:44px;background:var(--border);flex-shrink:0;}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;}
.card.glow{box-shadow:0 0 20px rgba(56,189,248,0.05);}
.card.warn{box-shadow:0 0 24px rgba(251,191,36,0.15);border-color:#3d2e00!important;}
.card.danger{box-shadow:0 0 24px rgba(239,68,68,0.2);border-color:#3d1515!important;}
.card.safe{box-shadow:0 0 20px rgba(52,211,153,0.06);}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.grid3t{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.span3{grid-column:1/-1;}
.col-r{display:flex;flex-direction:column;gap:14px;}
.tab{padding:8px 16px;cursor:pointer;font-size:11px;letter-spacing:.1em;font-weight:500;border-bottom:2px solid transparent;color:var(--muted);transition:all .2s;font-family:var(--font);background:none;border-left:none;border-right:none;border-top:none;}
.tab:hover{color:#94a3b8;}.tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.tabpanel{display:none;}.tabpanel.active{display:block;animation:si .35s ease-out;}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:.08em;font-family:var(--font);}
.bull{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.2);}
.bear{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.neut{background:rgba(148,163,184,.1);color:#94a3b8;border:1px solid rgba(148,163,184,.15);}
.ah-bear{background:rgba(251,146,60,.15);color:var(--orange);border:1px solid rgba(251,146,60,.25);}
.badge{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2);border-radius:4px;padding:2px 8px;font-size:9px;color:var(--blue);letter-spacing:.08em;}
.badge-warn{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:4px;padding:2px 8px;font-size:9px;color:var(--red);letter-spacing:.08em;}
.badge-green{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2);border-radius:4px;padding:2px 8px;font-size:9px;color:var(--green);letter-spacing:.08em;}
.label{font-size:9px;color:var(--dim);letter-spacing:.12em;margin-bottom:2px;}
.micro{font-size:9px;color:var(--muted);letter-spacing:.1em;}
.tiny{font-size:10px;color:var(--muted);}
.small{font-size:11px;color:var(--muted);line-height:1.6;}
.pbar-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.pbar-fill{height:100%;border-radius:3px;}
.lbar-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px;}
.lbar-fill{height:100%;border-radius:2px;opacity:.7;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes si{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cell{background:var(--bg2);border-radius:4px;padding:8px;border:1px solid var(--border);}
.cell-label{font-size:9px;color:var(--dim);margin-bottom:2px;}
.cell-val{font-size:15px;font-weight:600;}
.news-row{display:flex;align-items:flex-start;gap:14px;padding:13px 10px;border-bottom:1px solid #0f1923;}
.news-row.hot{background:rgba(239,68,68,.02);}
.news-time{font-size:10px;color:var(--vdim);min-width:52px;flex-shrink:0;}
.news-text{flex:1;font-size:12px;color:var(--muted);line-height:1.5;}
.news-text.hot-text{color:#cbd5e1;}
.level-row{display:flex;align-items:center;gap:10px;padding:9px;border-radius:4px;border:1px solid transparent;}
.level-row.current{background:rgba(56,189,248,.05);border-color:rgba(56,189,248,.15)!important;}
.level-row.flip{background:rgba(52,211,153,.05);border-color:rgba(52,211,153,.15)!important;}
.level-row.wall{background:rgba(251,191,36,.05);border-color:rgba(251,191,36,.15)!important;}
.level-price{width:64px;font-size:14px;font-weight:700;text-align:right;}
.level-bar{flex:1;}
.level-label{font-size:11px;width:170px;}
.journey-bars{display:flex;align-items:flex-end;gap:6px;height:72px;margin-bottom:6px;}
.j-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.j-bar{width:100%;border-radius:2px 2px 0 0;}
.j-bar-date{font-size:9px;color:var(--vdim);}
.journey-stats{display:flex;justify-content:space-between;padding:8px;background:var(--bg2);border-radius:4px;border:1px solid var(--border);flex-wrap:wrap;gap:8px;}
@media(max-width:900px){.grid3{grid-template-columns:1fr 1fr;}.grid4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.grid3,.grid2,.grid4{grid-template-columns:1fr;}}
</style>
</head>
<body>
<script>

// POSITION STRUCTURE
const STRIKES = { putLong:6850.0, putShort:6900.0, callShort:7970.0, callLong:8020.0 };
const CONTRACTS = 69;

const SPX = 7515.34;   // Schwab close (authority)
const SPX_AH = 0;
const SPY = 0;
const SPX_CHANGE_PTS = -60.05;
const SPX_CHANGE_PCT = -0.79;

const SESSION = `bearish`;
const SESSION_NOTE   = `New condor day. Closed the 8/7 condor for a +$10,880 realized win (5th straight) rather than defend last week's stressed 7825 call short, and opened a fresh 8/21 condor, re-centered with far more room. SPX fell -0.79% (Barchart authoritative; the fetch printed a stale higher number), so spot moved away from the new calls on day one. The reset shows in the greeks: call buffer 455pts, delta and gamma roughly a third of Friday's. Green at +$1,725, positive gamma. VIX ticked up and oil is back near $80 on Iran. CPI, Warsh testimony, and bank earnings all land tomorrow.`;

const CANDLE = { open:7570.0, high:7581.0, low:7508.0, close:SPX, volume:"n/a", avgVol:"n/a" };
const MACRO  = { vix:17.16, brent:85.37, wti:80.08 };

const GREEKS = { delta:"-64.4", theta:"+1512.0", gamma:"-1.05", vega:"-8110.0", gammaSource:"TOS", gammaDerived:"-0.99", gammaVsTos:"-5.4%" };

const INITIAL_CREDIT = 5.2;   // blended all-in credit/ct (authoritative, via --credit)
const MARK = 4.95;   // Schwab net MV / ct / 100 = cost to close

const CONDOR_OPEN_DATE = `Jul 13`;

// ════════════════════════════════════════════════════════════
//  DATE / DTE — fully dynamic (EXPIRY_DATE auto-derived from expiry code)
// ════════════════════════════════════════════════════════════
const TODAY        = new Date();
const EXPIRY_DATE  = new Date(2026, 7, 21);   // auto-derived — stays in sync with EXPIRY
const HOLIDAYS     = ["2026-09-07"];
const localDateStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const CD_DTE       = Math.ceil((EXPIRY_DATE - new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate())) / (1000*60*60*24));
const TD_DTE       = (()=>{
  let count=0, d=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()+1);
  while(d<=EXPIRY_DATE){
    const day=d.getDay(), ds=localDateStr(d);
    if(day!==0 && day!==6 && !HOLIDAYS.includes(ds)) count++;
    d.setDate(d.getDate()+1);
  }
  return count;
})();

// GEX DATA — Barchart
const GEX = { flipPoint:7464.57, putWall:7500.0, callWall:7500.0, iv:13.99, hv:14.87, ivRank:21.24, ivPct:50, expectedMoveUp:7859.02, expectedMoveDown:7171.66 };

const COMPLETED_CATALYSTS = [

  { date:"Jul 8",  event:"Ceasefire declared over; hawkish Fed minutes; oil ~$80", color:"#f87171" },
  { date:"Jul 9",  event:"Risk-on +0.81%; semis melt-up (Micron, SK Hynix)", color:"#34d399" },
  { date:"Jul 10", event:"New high +0.42%; SK Hynix record debut; IEA cut oil demand", color:"#34d399" },

];;

  { date:"Jun 4", spx:7600.00, callBuf:null, putBuf:null, gexFlip:null, session:"neutral", note:"New condor opened: PUT 6925/6975 · CALL 8030/8080 x48 for $5.85 (exp 7/17). Same-day rolled puts to 6950/7000 (+$0.15). Replaced 8000/8050 x46 condor (closed +$2,760.00)." },
  { date:"Jun 5", spx:7383.74, callBuf:Math.round(7990-7383.74), putBuf:Math.round(7383.74-7000), gexFlip:7550.01, session:"bearish", note:"Semi rout: Broadcom AI outlook + hot NFP spiked yields. SPX -2.64% to 7,383.74. VIX +34% to 21.5. Rolled calls DOWN 8030→7990 (4 steps, +$0.40) locking call-side profit. SPX now BELOW flip 7,550 = negative gamma." },
  { date:"Jun 8", spx:7405.73, callBuf:Math.round(7990-7405.73), putBuf:Math.round(7405.73-7000), gexFlip:7478.11, session:"bullish", note:"Relief bounce +0.30% to 7,405.73. Chips rebounded (MU +10%, SOXX +6%). VIX -12% to 18.9 → mark recovered, position green +$480.00 AH. Rolled calls down 7990→7950 (+$0.20) after close. Flip eased to 7,478." },
  { date:"Jun 9", spx:7386.65, callBuf:Math.round(7950-7386.65), putBuf:Math.round(7386.65-7000), gexFlip:7465.96, session:"bearish", note:"Volatile swing: -2.3% intraday to low 7,237, recovered to -0.26% close. VIX spiked to 23.34 intraday. Mark $7.75, P&L -$5,520.00." },
  { date:"Jun 10",spx:7266.99, callBuf:Math.round(7950-7266.99), putBuf:Math.round(7266.99-7000), gexFlip:null, session:"bearish", note:"CPI day: May CPI hot at 4.2% YoY (3-yr high), though core softer (0.2% m/m). Markets sold off — SPX -1.62% to 7,266.99, near put side (267pts). Nasdaq -1.98%." },
  { date:"Jun 11",spx:7394.30, callBuf:Math.round(7950-7394.30), putBuf:Math.round(7394.30-7000), gexFlip:7393.28, session:"bullish", note:"Rebound +1.75% to 7,394.30 off CPI low. VIX -12.5% to 19.44. Mark recovered to $7.55 close ($7.25 AH). SPX right ON the flip. Iran de-escalation hopes building." },
  { date:"Jun 12",spx:7431.46, callBuf:Math.round(7950-7431.46), putBuf:Math.round(7431.46-7000), gexFlip:7382.11, session:"bullish", note:"Week ends GREEN +$3,360.00. SPX +0.50% to 7,431.46, above flip 7,382 = positive gamma. VIX -9% to 17.68, oil falling. Trump canceled Iran strikes, peace deal near. SpaceX IPO'd +22%. Mark $5.90." },
  { date:"Jun 14",spx:7519.60, callBuf:Math.round(7950-7519.60), putBuf:Math.round(7519.60-7000), gexFlip:7382.11, session:"bullish", note:"SUN: Iran PEACE DEAL reached — permanent end to military ops; Trump reopening Strait of Hormuz. Oil -4%. Futures-implied SPX ~7,520; ToS indicative mark $5.30 → +$6,240.00 (7/17 condor, before it was closed Mon)." },
  { date:"Jun 15",spx:7554.29, callBuf:521, putBuf:604, gexFlip:7299.32, session:"bullish", note:"Iran deal confirmed: SPX +1.65% to 7,554, Nasdaq +2.38%, oil -5%, VIX 16.2, IV crushed. CLOSED 7/17 condor at $5.35 = +$6,000.00 realized. Opened NEW 7/31 condor 6900/6950·8075/8125 x49 for $6.06 — re-centered higher/wider. Mark $5.75 → +$1,519.00." },
  { date:"Jun 16",spx:7511.35, callBuf:529, putBuf:561, gexFlip:7385.10, session:"neutral", note:"FOMC eve. Rotational pullback — Dow record high, Nasdaq -2% on chip selloff, SPX -0.57% to 7,511. Oil <$80 (WTI 76.6). Iran MOU formally signed. Rolled calls DOWN twice (8075→8050→8040, +$0.60) harvesting premium. Mark $5.95 → +$3,479.00. Credit now $6.66." },
  { date:"Jun 25",spx:7357.49, callBuf:593, putBuf:407, gexFlip:7454.83, session:"neutral", note:"PCE day, flat close (-0.01% to 7,357). Headline PCE hot at 4.1% y/y (highest since Apr-23) but monthly 0.4% (0.1pp below est) and core held 3.3% → no hawkish shock. Futures held positive, yields slipped, Sept hike odds trimmed slightly. Intraday swung 7,419 high to 7,323 low then recovered to flat — put side never tested (low 373pts above 6,950). No position change. Mark $6.48 → +$6,466.00. SPX 97pts below flip 7,455 = neg gamma (less deep than yesterday). Oil bounced (WTI 71.5). Put buffer held 407pts." },
  { date:"Jun 26",spx:7354.02, callBuf:571, putBuf:404, gexFlip:7460.36, session:"neutral", note:"Fri (built Sat): SPX -0.05% to 7,354. Gapped down to 7,313 open on renewed tech selloff (Apple -6%, AI-infrastructure-cost fears, OpenAI IPO-delay report; Nasdaq's 4th straight down day, Kospi -5%), tested a 7,294 low intraday — put buffer compressed to ~360pts at the low — then recovered to flat. VIX spiked to 20.7, faded to 18.4. Rolled calls down to 7925/7975 (+0.15); blended 7.59. Put wall dropped to 7,300. SPX 106pts below flip = neg gamma. Δ rose to +93.8 (most long yet). Mark $6.55 → +$6,968.00. Put side held (404pts) through the test." },
  { date:"Jun 29",spx:7440.43, callBuf:460, putBuf:615, gexFlip:7406.97, session:"bullish", note:"NEW CONDOR. Closed the 7/31 at $5.35 → +$15,008.00 realized (largest win of the campaign). Opened 6775/6825·7900/7950 exp 8/7, 68 ct, blended $5.70 (after a put roll up 6750→6775). Relief rally +1.18% to 7,440 — Dow >52k (Alphabet joined the index, +5%), Nasdaq +2%, megacaps bounced after last week's selloff; SCOTUS let Fed's Cook keep her seat. Back ABOVE flip 7,407 = POSITIVE gamma. Call side now the closer wing (460pts) after the rally; put side 615pts. Mark $5.95 → -$1,700.00 (normal just-opened MTM). Jobs report Thursday." },
  { date:"Jun 30",spx:7499.36, callBuf:401, putBuf:624, gexFlip:null, session:"bullish", note:"Rally continued +0.79% to 7,499 (dashboard build skipped this day). Rolled the put side UP twice on the strength — 6775/6825 → 6800/6850 (+$0.15) → 6825/6875 (+$0.12) — harvesting premium from the far wing, blended credit to $5.97. Call side tightened to ~401pts as SPX pushed higher." },
  { date:"Jul 1",spx:7483.23, callBuf:417, putBuf:608, gexFlip:7418.46, session:"neutral", note:"Modest pullback -0.22% (vs 6/30's 7,499), gapping down to a 7,479 open, running to a 7,522 high, dipping to 7,449, closing 7,483. ISM Manufacturing 53.3 (soft, below 54.0 est) but input prices fell 9.1pts — disinflationary tint; oil kept sliding (WTI 67.8). VIX eased to 16.6, IV pct compressed to 41. Still ABOVE flip 7,418 = positive gamma. Mark $5.80 → +$1,156.00 (GREEN). Δ-81.6 and γ-1.17 both most negative yet — call side the pressured wing (417pts, EM ceiling now just 176pts below the 7900 short). Jobs report tomorrow." },
  { date:"Jul 2",spx:7483.24, callBuf:392, putBuf:583, gexFlip:7451.65, session:"neutral", note:"JOBS DAY, flat close (+0.00% to 7,483.24) but a wild 113pt range — ran to 7,540 then dropped to 7,428. June payrolls SHOCKED at just 57K (vs ~113K est), a soft print that broke the hot streak and supports Fed-on-hold; Oct hike odds fell. Big rotation under the flat headline: Dow to a record (+1.14%) while Nasdaq -0.8% (semis -4.5%, Tesla -7%). Rolled both wings for credit into the spike — puts up to 6850/6900 (+$0.10), CALLS DOWN to 7875/7925 (+$0.55, harvesting the 7,540 high). Blended credit jumped to $6.62. Mark $5.70 → +$6,256.00. Call short now 7875 (tightest yet, 392pts); still 192pts above EM ceiling 7,683 after the vol crush (IV pct 30). Still ABOVE flip 7,452 but only 32pts of cushion. γ-1.28 most negative yet." },
  { date:"Jul 6",spx:7537.43, callBuf:338, putBuf:612, gexFlip:7435.36, session:"bullish", note:"Post-holiday melt-up +0.72% to 7,537.43 (official close; Schwab intraday printed 7,549, reconciled to Barchart). Tech-led: Nasdaq +1.12%, semis surged (WDC +7%, Lam/AMAT/KLA ~+4% on MS target hikes), Dow record 53,055.91. Oil soft on OPEC+ +188K bpd (5th monthly increase). S&P Global Services PMI 51.3 (in-line). Rolled the put side up to 6875/6925 (+$0.10), blended $6.72. Mark $5.85 → +$5,916.00. The grind higher cut the call buffer to 338pts (tightest of the campaign); call short 7875 now just 143pts above the EM ceiling 7,732. Still ABOVE flip 7,435 by 102pts = positive gamma. γ-1.53 most negative yet. Put side a comfortable 612pts." },
  { date:"Jul 7",spx:7503.85, callBuf:371, putBuf:579, gexFlip:7452.24, session:"bearish", note:"Reversal -0.45% to 7,503.85 — IRAN RISK BACK. Oil spiked (WTI 71.86 +5%, Brent 75.52) after the US revoked the license for Iranian oil sales and Iran attacked a Qatari LNG tanker near Hormuz (threat level 'severe'). Semis rotation down again (Samsung earnings spooked chips: SMH -3%, Micron -4.7%, Nasdaq -1.16%); Dow off just 0.25% from records. VIX rose to 16.13 (+3.6%) — geopolitical risk re-entering. No roll today. Mark collapsed to $5.05 → +$11,356.00 (BEST of the campaign) as the pullback + theta crushed the cost to close. Call buffer improved to 371pts (SPX backing off two days). Still ABOVE flip 7,452 by 52pts = positive gamma, thinning. γ-1.43. Fed minutes tomorrow." },
  { date:"Jul 8",spx:7482.71, callBuf:342, putBuf:558, gexFlip:7462.36, session:"bearish", note:"CEASEFIRE OVER: Trump declared the Iran ceasefire ended (US struck Kharg Island), driving a risk-off day — SPX -0.28% (down 600+ Dow points intraday, low 7,421), only Energy green. Oil surged (Brent ~$79, briefly $80; WTI 74.76), 10yr to 4.58% (4-wk high) on inflation fear. VIX popped to 18.91 intraday, closed 16.90. Fed minutes confirmed hawkish (several favored hiking, many see year-end rate above current range) but the war headline dominated. Rolled the CALL side DOWN TWICE for credit into the drop — 7875→7850→7825 (+$0.60, +$0.65), blended to $7.97 ($54,196). Mark $6.15 → +$12,376.00 (campaign best). BUT: only 20pts above the flip now (positive-gamma cushion nearly gone), call short 7825 the tightest of the campaign, γ-1.61 and vega -8,602 both most negative yet. IV pct jumped to 47." },

function gaugeArc(pct){
  const r=52,cx=70,cy=68,s=-210,e=-210+240*Math.min(pct,1),rad=a=>a*Math.PI/180;
  const x1=cx+r*Math.cos(rad(s)),y1=cy+r*Math.sin(rad(s));
  const x2=cx+r*Math.cos(rad(e)),y2=cy+r*Math.sin(rad(e));
  return `M ${x1} ${y1} A ${r} ${r} 0 ${e-s>180?1:0} 1 ${x2} ${y2}`;
}
function gauge(buf,bufPct,maxPts,color){
  const pct=Math.min(buf/maxPts,1);
  return `<svg width="150" height="108" viewBox="0 0 140 102" style="display:block;margin:0 auto;">
    <path d="${gaugeArc(1)}" fill="none" stroke="#1a2332" stroke-width="8" stroke-linecap="round"/>
    <path d="${gaugeArc(pct)}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" style="filter:drop-shadow(0 0 5px ${color})"/>
    <text x="70" y="51" text-anchor="middle" fill="${color}" font-size="22" font-weight="700" font-family="IBM Plex Mono,monospace">${Math.round(buf)}</text>
    <text x="70" y="69" text-anchor="middle" fill="${color}" font-size="14" font-weight="600" font-family="IBM Plex Mono,monospace" opacity="0.9">${bufPct}%</text>
    <text x="70" y="84" text-anchor="middle" fill="#475569" font-size="8" font-family="IBM Plex Mono,monospace">PTS / % TO SHORT STRIKE</text>
  </svg>`;
}

              const pc=row.putBuf===null?"#334155":bufColor(row.putBuf);
              const fc=row.gexFlip===null?"#334155":row.gexFlip>7000?"#fbbf24":row.gexFlip>6000?"#34d399":"#38bdf8";
              return `<tr style="border-bottom:1px solid #0f1923;background:${isToday?"rgba(56,189,248,.04)":"transparent"};">
                <td style="padding:9px 12px;color:${isToday?"var(--blue)":"#94a3b8"};font-weight:${isToday?600:400};">${row.date}${isToday?" ◀":""}</td>
                <td style="padding:9px 12px;color:#e2e8f0;font-weight:600;">${fmt(row.spx)}</td>
                <td style="padding:9px 12px;color:${cc};font-weight:500;">${row.callBuf!==null?row.callBuf+"pts":"—"}</td>
                <td style="padding:9px 12px;color:${pc};font-weight:500;">${row.putBuf!==null?row.putBuf+"pts":"—"}</td>
                <td style="padding:9px 12px;color:${fc};">${row.gexFlip!==null?fmt(row.gexFlip):"—"}</td>
                <td style="padding:9px 12px;"><div style="display:flex;align-items:center;gap:6px;">
                  <div style="width:6px;height:6px;border-radius:50%;background:${sColor(row.session)};flex-shrink:0;"></div>
                  <span style="color:${sColor(row.session)};font-size:10px;">${row.session.toUpperCase()}</span>
                </div></td>
                <td style="padding:9px 12px;color:var(--muted);font-size:10px;max-width:300px;">${row.note}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    </div>
    <div class="card glow" style="padding:20px;">
      <div class="micro" style="margin-bottom:16px;letter-spacing:.15em;">ROLL LOG</div>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:11px;">
          <thead><tr style="border-bottom:1px solid #1a2332;">
            ${["DATE","SIDE","FROM","TO","DIR","CREDIT","NOTE"].map(h=>`
              <th style="padding:8px 12px;text-align:left;font-size:9px;color:var(--dim);letter-spacing:.1em;font-weight:500;">${h}</th>`).join("")}
          </tr></thead>
          <tbody>
            ${ROLL_LOG.map(row=>{
              const isOpen=row.side==="OPEN";
              const sc=isOpen?"var(--blue)":row.side==="PUT"?"var(--green)":"var(--yellow)";
              return `<tr style="border-bottom:1px solid #0f1923;background:${isOpen?"rgba(56,189,248,.04)":"transparent"};">
                <td style="padding:9px 12px;color:${isOpen?"var(--blue)":"#94a3b8"};font-weight:${isOpen?600:400};">${row.date}</td>
                <td style="padding:9px 12px;"><span style="color:${sc};font-weight:600;font-size:10px;">${row.side}</span></td>
                <td style="padding:9px 12px;color:var(--dim);font-size:10px;">${row.from}</td>
                <td style="padding:9px 12px;color:#e2e8f0;font-weight:600;font-size:10px;">${row.to}</td>
                <td style="padding:9px 12px;color:var(--muted);">${row.dir}</td>
                <td style="padding:9px 12px;color:var(--green);font-weight:600;">${row.credit}</td>
                <td style="padding:9px 12px;color:var(--muted);font-size:10px;">${row.note}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
      <div style="margin-top:12px;padding:10px;background:var(--bg2);border-radius:4px;border:1px solid var(--border);display:flex;gap:24px;flex-wrap:wrap;">
        <div><div style="font-size:9px;color:var(--dim);margin-bottom:2px;">TOTAL COLLECTED</div>
          <div style="font-size:14px;color:var(--green);font-weight:700;">${usd(TOTAL_COLLECTED)} <span style="font-size:10px;color:var(--muted);">(${usd(TOTAL_COLLECTED*100)}/ct)</span></div></div>
        <div><div style="font-size:9px;color:var(--dim);margin-bottom:2px;">CONTRACTS</div>
          <div style="font-size:14px;color:var(--blue);font-weight:700;">${CONTRACTS}</div></div>
        <div><div style="font-size:9px;color:var(--dim);margin-bottom:2px;">CURRENT STRIKES</div>
          <div style="font-size:12px;color:#e2e8f0;font-weight:600;">${STRIKES.putLong}/${STRIKES.putShort} · ${STRIKES.callShort}/${STRIKES.callLong}</div></div>
        <div><div style="font-size:9px;color:var(--dim);margin-bottom:2px;">UNREALIZED P&L</div>
          <div style="font-size:14px;color:${PL_COLOR};font-weight:700;">${usd(UNREALIZED_PL, true)} <span style="font-size:10px;color:var(--muted);">(${PL_PCT}%)</span></div></div>
      </div>
    </div>
  </div>`;

  document.getElementById("panel-chart").innerHTML=`
  <div style="display:flex;flex-direction:column;gap:16px;">
    <div class="grid4">
      ${[
        ["Short Call",fmt(STRIKES.callShort),bufColor(CALL_BUF),`${Math.round(CALL_BUF)}pts (${CALL_BUF_PCT}%)`],
        ["Long Call", fmt(STRIKES.callLong), "#94a3b8","Protection ceiling"],
        ["Short Put", fmt(STRIKES.putShort), bufColor(PUT_BUF),`${Math.round(PUT_BUF)}pts (${PUT_BUF_PCT}%)`],
        ["Long Put",  fmt(STRIKES.putLong),  "#94a3b8","Protection floor"],
      ].map(([l,v,c,sub])=>`
        <div class="card glow" style="padding:12px;">
          <div style="font-size:9px;color:var(--dim);margin-bottom:3px;">${l}</div>
          <div style="font-size:18px;font-weight:700;color:${c};margin-bottom:2px;">${v}</div>
          <div style="font-size:9px;color:var(--muted);">${sub}</div>
        </div>`).join("")}
    </div>
    <div class="card glow" style="padding:0;overflow:hidden;border-radius:8px;">
      <div style="padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:10px;"><div class="dot"></div>
          <span style="font-size:11px;color:var(--blue);font-weight:600;letter-spacing:.08em;">SPX500 LIVE CHART — TradingView</span>
        </div>
        <span style="font-size:9px;color:var(--green);">● Live data</span>
      </div>
      <div class="tradingview-widget-container" style="height:520px;width:100%;">
        <div class="tradingview-widget-container__widget" style="height:100%;width:100%;"></div>
      </div>
    </div>
  </div>`;

  setTimeout(()=>{
    const c=document.querySelector(".tradingview-widget-container__widget");
    if(!c)return;
    const s=document.createElement("script");
    s.type="text/javascript";
    s.src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
    s.async=true;
    s.innerHTML=JSON.stringify({
      autosize:true,symbol:"SPX500",interval:"5",timezone:"America/New_York",
      theme:"dark",style:"1",locale:"en",backgroundColor:"#080c14",
      gridColor:"rgba(26,35,50,0.6)",hide_top_toolbar:false,hide_legend:false,
      save_image:false,hide_volume:false,support_host:"https://www.tradingview.com"
    });
    c.appendChild(s);
  },100);

  document.getElementById("footer-right").textContent=
    `PUT ${STRIKES.putLong}/${STRIKES.putShort} · CALL ${STRIKES.callShort}/${STRIKES.callLong} · x${CONTRACTS} · EXP ${EXPIRY} · SPX ${fmt(SPX)} · FLIP ${fmt(GEX.flipPoint)}`;
});
</script>

<div id="header" class="header"></div>
<div id="pricebar" class="pricebar"></div>
<div class="tabbar">
  <button class="tab active" data-tab="overview">OVERVIEW</button>
  <button class="tab"        data-tab="levels">LEVELS</button>
  <button class="tab"        data-tab="news">NEWS</button>
  <button class="tab"        data-tab="calendar">CALENDAR</button>
  <button class="tab"        data-tab="history">HISTORY</button>
  <button class="tab"        data-tab="chart">LIVE CHART</button>
</div>
<div class="content">
  <div id="panel-overview"  class="tabpanel active"></div>
  <div id="panel-levels"    class="tabpanel"></div>
  <div id="panel-news"      class="tabpanel"></div>
  <div id="panel-calendar"  class="tabpanel"></div>
  <div id="panel-history"   class="tabpanel"></div>
  <div id="panel-chart"     class="tabpanel"></div>
</div>
<div class="footer">
  <span style="font-size:9px;color:#1e293b;letter-spacing:.1em;">FOR EDUCATIONAL PURPOSES ONLY — NOT FINANCIAL ADVICE</span>
  <span id="footer-right" style="font-size:9px;color:#334155;"></span>
</div>
</body>
</html>
