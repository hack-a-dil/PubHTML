<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPX Condor Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#080c14; --bg2:#0a0f1a; --bg3:#0d1420; --border:#1a2332;
  --text:#e2e8f0; --muted:#64748b; --dim:#475569; --vdim:#334155;
  --green:#34d399; --yellow:#fbbf24; --red:#f87171; --blue:#38bdf8; --purple:#818cf8;
  --font:'IBM Plex Mono','Courier New',monospace;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:var(--bg)} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.pricebar{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.tabbar{background:var(--bg);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px;}
.content{padding:20px 24px;}
.footer{padding:10px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;margin-top:24px;}
.divider{width:1px;height:44px;background:var(--border);flex-shrink:0;}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;}
.card.glow{box-shadow:0 0 20px rgba(56,189,248,0.05);}
.card.warn{box-shadow:0 0 24px rgba(251,191,36,0.15);border-color:#3d2e00!important;}
.card.safe{box-shadow:0 0 20px rgba(52,211,153,0.06);}
.card.danger{box-shadow:0 0 24px rgba(239,68,68,0.2);border-color:#3d1515!important;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.grid3t{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.span3{grid-column:1/-1;}
.col-r{display:flex;flex-direction:column;gap:14px;}
.tab{padding:8px 16px;cursor:pointer;font-size:11px;letter-spacing:.1em;font-weight:500;border-bottom:2px solid transparent;color:var(--muted);transition:all .2s;font-family:var(--font);background:none;border-left:none;border-right:none;border-top:none;}
.tab:hover{color:#94a3b8;} .tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.tabpanel{display:none;} .tabpanel.active{display:block;animation:si .35s ease-out;}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:.08em;font-family:var(--font);}
.bull{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.2);}
.bear{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.neut{background:rgba(148,163,184,.1);color:#94a3b8;border:1px solid rgba(148,163,184,.15);}
.badge{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2);border-radius:4px;padding:2px 8px;font-size:9px;color:var(--blue);letter-spacing:.08em;}
.badge-warn{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:4px;padding:2px 8px;font-size:9px;color:var(--red);letter-spacing:.08em;}
.label{font-size:9px;color:var(--dim);letter-spacing:.12em;margin-bottom:2px;}
.micro{font-size:9px;color:var(--muted);letter-spacing:.1em;}
.tiny{font-size:10px;color:var(--muted);}
.small{font-size:11px;color:var(--muted);line-height:1.6;}
.pbar-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.pbar-fill{height:100%;border-radius:3px;transition:width .6s ease;}
.lbar-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px;}
.lbar-fill{height:100%;border-radius:2px;opacity:.7;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes si{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cell{background:var(--bg2);border-radius:4px;padding:8px;border:1px solid var(--border);}
.cell-label{font-size:9px;color:var(--dim);margin-bottom:2px;}
.cell-val{font-size:15px;font-weight:600;}
.news-row{display:flex;align-items:flex-start;gap:14px;padding:13px 10px;border-bottom:1px solid #0f1923;}
.news-row.hot{background:rgba(239,68,68,.02);}
.news-time{font-size:10px;color:var(--vdim);min-width:52px;flex-shrink:0;}
.news-text{flex:1;font-size:12px;color:var(--muted);line-height:1.5;}
.news-text.hot-text{color:#cbd5e1;}
.level-row{display:flex;align-items:center;gap:10px;padding:9px;border-radius:4px;border:1px solid transparent;}
.level-row.current{background:rgba(56,189,248,.05);border-color:rgba(56,189,248,.15)!important;}
.level-row.flip{background:rgba(239,68,68,.05);border-color:rgba(239,68,68,.15)!important;}
.level-price{width:64px;font-size:14px;font-weight:700;text-align:right;}
.level-bar{flex:1;}
.level-label{font-size:11px;width:150px;}
.journey-bars{display:flex;align-items:flex-end;gap:6px;height:72px;margin-bottom:6px;}
.j-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.j-bar-val{font-size:9px;}
.j-bar{width:100%;border-radius:2px 2px 0 0;}
.j-bar-date{font-size:9px;color:var(--vdim);}
.journey-stats{display:flex;justify-content:space-between;padding:8px;background:var(--bg2);border-radius:4px;border:1px solid var(--border);flex-wrap:wrap;gap:8px;}
.jstat{font-size:10px;color:var(--muted);}
.jstat span{font-weight:600;}
.gex-alert{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:6px;padding:12px;margin-bottom:16px;}
@media(max-width:900px){.grid3{grid-template-columns:1fr 1fr;}.grid5{grid-template-columns:repeat(3,1fr);}}
@media(max-width:600px){.grid3,.grid2{grid-template-columns:1fr;}.grid5{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<script>
// ════════════════════════════════════════════════════════════
//  DAILY UPDATE — CHANGE ONLY THIS SECTION
// ════════════════════════════════════════════════════════════
const SPX            = 7399.50;
const SPX_AH         = 0;
const SPY            = 738.01;
const SPX_CHANGE_PTS = -9.0;
const SPX_CHANGE_PCT = -0.12;
const TIMESTAMP      = "May 18, 2026  4:32 PM ET";
const CD_DTE         = 31;
const TD_DTE         = 22;
const SESSION        = "bearish";

const CANDLE = { open:7415, high:7441, low:7335, close:SPX, volume:"46.3M", avgVol:"49.3M" };
const STATS  = { pe:28.34, week52High:7517, week52Low:5756 };

// ════════════════════════════════════════════════════════════
//  GEX DATA — update when new barchart screenshot available
// ════════════════════════════════════════════════════════════
const GEX = {
  flipPoint:  7345.47,   // 🚨 was 6739 on May 15 — jumped +606pts
  putWall:    7400.00,   // was 7000 on May 15 — jumped +400pts
  callWall:   7400.00,   // unchanged
  iv:         15.05,
  hv:         11.79,
  ivRank:     28.00,
  ivPct:      66,
  regime:     "EDGE",    // "POSITIVE" | "EDGE" | "NEGATIVE"
  flipBuffer: 7399.50 - 7345.47,  // only 54pts above flip — critical
  note:       "🚨 Flip jumped +606pts since May 15. SPX only 54pts above flip. Regime at critical edge.",

const PRICE_HISTORY = [

  { date:"May 6",  spx:7290 },
  { date:"May 8",  spx:7335 },
  { date:"May 9",  spx:7320 },
  { date:"May 12", spx:7413 },
  { date:"May 13", spx:7444 },
  { date:"May 14", spx:7501 },
  { date:"May 15", spx:7408 },
  { date:"May 18", spx:SPX  },
];

const NEWS = [
  { time:"TODAY",   text:"🚨 GEX FLIP JUMPED from 6,739 → 7,345 (+606pts). SPX only 54pts above flip — regime at critical edge", impact:"bearish", hot:true  },
  { time:"TODAY",   text:"Put wall surged from 7,000 → 7,400 — now same as call wall. 7,400 = massive magnet level both ways", impact:"neutral", hot:true  },
  { time:"TODAY",   text:"UAE nuclear plant drone strike weekend — Iran sent amended peace terms via Pakistani mediators", impact:"neutral", hot:true  },

const SESSION_SUMMARY = "Morning rip to 7,441 rejected at GEX call wall 7,400. Relentless selloff to 7,335 low. Late recovery to 7,399. GEX structure working as predicted — but flip point has moved dangerously close to current price.";

const CALENDAR = [
  { day:"MON 5/18", event:"GEX flip ↑ to 7,345", done:true,  impact:"high"   },
  { day:"TUE 5/19", event:"🚨 Iran Situation Room", done:false, impact:"high"  },
  { day:"WED 5/20", event:"🚨 Nvidia + FOMC mins",  done:false, impact:"high"  },
  { day:"THU 5/21", event:"Walmart Earnings",       done:false, impact:"medium"},
  { day:"WED 6/10", event:"🚨 May CPI",             done:false, impact:"high"  },
];

const TIMELINE = [
  { date:"May 19",    label:"Iran Situation Room 🚨",  color:"#ef4444" },
  { date:"May 20",    label:"Nvidia + FOMC mins 🚨",   color:"#ef4444" },
  { date:"May 26",    label:"Memorial Day (closed)",   color:"#64748b" },
  { date:"Jun 10",    label:"May CPI 🚨",              color:"#ef4444" },
  { date:"Jun 16-17", label:"FOMC meeting",            color:"#f59e0b" },
  { date:"Jun 18",    label:"🎯 YOUR EXPIRATION",      color:"#38bdf8" },
];

// ════════════════════════════════════════════════════════════
//  STATIC CONFIG
// ════════════════════════════════════════════════════════════
const STRIKES  = { putLong:6770, putShort:6820, callShort:7750, callLong:7800 };
const EXPIRY   = "June 18, 2026";
const TOTAL_CD = 36;
const TOTAL_TD = 25;

// ════════════════════════════════════════════════════════════
//  DERIVED
// ════════════════════════════════════════════════════════════
const CALL_BUF     = STRIKES.callShort - SPX;
const PUT_BUF      = SPX - STRIKES.putShort;
const CALL_BUF_PCT = ((CALL_BUF / SPX) * 100).toFixed(1);
const PUT_BUF_PCT  = ((PUT_BUF  / SPX) * 100).toFixed(1);
const CALL_WARN    = CALL_BUF < 300;
const FLIP_BUF     = SPX - GEX.flipPoint;
const SESSION_COLOR = SESSION==="bullish"?"#34d399":SESSION==="bearish"?"#f87171":"#94a3b8";
const SESSION_TAG   = SESSION==="bullish"?"bull":SESSION==="bearish"?"bear":"neut";
const SESSION_LABEL = SESSION==="bullish"?"▲ BULLISH SESSION":SESSION==="bearish"?"▼ BEARISH SESSION":"◆ NEUTRAL SESSION";
const ATH_SPX  = Math.max(...PRICE_HISTORY.map(p=>p.spx));
const OPEN_SPX = PRICE_HISTORY[0].spx;

const KEY_LEVELS = [
  { price:STRIKES.callLong,  label:"Long Call",             type:"strike"     },
  { price:STRIKES.callShort, label:"Short Call 🎯",         type:"strike"     },
  { price:7600,              label:"Roll Trigger ⚠️",       type:"resistance" },
  { price:ATH_SPX,           label:"ATH (May 14)",          type:"resistance" },
  { price:GEX.callWall,      label:"GEX Call & Put Wall",   type:"resistance" },
  { price:SPX,               label:"Current ▶",             type:"current"    },
  { price:GEX.flipPoint,     label:"🚨 GEX Flip (NEW)",     type:"flip"       },
  { price:7320,              label:"Support",               type:"support"    },
  { price:STRIKES.putShort,  label:"Short Put 🎯",          type:"strike"     },
  { price:STRIKES.putLong,   label:"Long Put",              type:"support"    },
];

const SCENARIOS = [
  { label:"🟢 BULL CASE", desc:`Iran deal + Nvidia blowout. SPX pushes above 7,400 wall, charges toward ${STRIKES.callShort.toLocaleString()}. Roll urgently above 7,600.`, color:"#34d399", impact:"DANGER ⚠️"   },
  { label:"🟡 BASE CASE", desc:`SPX pins at 7,345–7,450 range. GEX walls contain movement. Theta grinds ${Math.round(CALL_BUF)}pt call buffer.`,                             color:"#fbbf24", impact:"THETA WINS ✓" },
  { label:"🔴 BEAR CASE", desc:`SPX breaks below flip 7,345 → negative gamma → amplified selloff. Put spread at ${STRIKES.putShort.toLocaleString()} still ${Math.round(PUT_BUF)}pts away.`, color:"#f87171", impact:"WATCH PUT SIDE" },
];

// ════════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════════
const fmt  = n => typeof n==="number" ? n.toLocaleString() : n;
const sign = n => n>=0 ? `+${n}` : `${n}`;

function gaugeArc(pct) {
  const r=52,cx=70,cy=68,s=-210,e=-210+240*Math.min(pct,1),rad=a=>a*Math.PI/180;
  const x1=cx+r*Math.cos(rad(s)),y1=cy+r*Math.sin(rad(s));
  const x2=cx+r*Math.cos(rad(e)),y2=cy+r*Math.sin(rad(e));
  return `M ${x1} ${y1} A ${r} ${r} 0 ${e-s>180?1:0} 1 ${x2} ${y2}`;
}

function gauge(bufPts, bufPct, maxPts, color) {
  const pct=Math.min(bufPts/maxPts,1);
  return `<svg width="150" height="108" viewBox="0 0 140 102" style="display:block;margin:0 auto;">
    <path d="${gaugeArc(1)}"   fill="none" stroke="#1a2332" stroke-width="8" stroke-linecap="round"/>
    <path d="${gaugeArc(pct)}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" style="filter:drop-shadow(0 0 5px ${color})"/>
    <text x="70" y="51" text-anchor="middle" fill="${color}" font-size="22" font-weight="700" font-family="IBM Plex Mono,monospace">${Math.round(bufPts)}</text>
    <text x="70" y="69" text-anchor="middle" fill="${color}" font-size="14" font-weight="600" font-family="IBM Plex Mono,monospace" opacity="0.9">${bufPct}%</text>
    <text x="70" y="84" text-anchor="middle" fill="#475569" font-size="8" font-family="IBM Plex Mono,monospace">PTS / % TO SHORT STRIKE</text>
  </svg>`;
}

// ════════════════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════════════════
window.addEventListener("DOMContentLoaded", () => {

  document.getElementById("header").innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;">
      <div style="display:flex;align-items:center;gap:8px;"><div class="dot"></div><span class="micro">LIVE</span></div>
      <span style="font-size:13px;color:var(--blue);font-weight:600;letter-spacing:.08em;">SPX CONDOR MONITOR</span>
      <span class="micro" style="color:var(--vdim);">EXP ${EXPIRY}</span>
      <span class="badge">PUT ROLLED ↑ ${STRIKES.putLong}/${STRIKES.putShort}</span>
      <span class="badge-warn">GEX FLIP ↑ 7,345</span>
    </div>
    <div style="display:flex;align-items:center;gap:20px;">
      <div style="text-align:right;">
        <div class="micro" style="margin-bottom:2px;">CD / TD REMAINING</div>
        <div style="font-size:14px;color:var(--blue);font-weight:600;">${CD_DTE}cd &nbsp;/&nbsp; ${TD_DTE}td</div>
      </div>
      <span class="tiny">${TIMESTAMP}</span>
    </div>`;

  document.getElementById("pricebar").innerHTML = `
    <div>
      <div class="label">SPX INDEX</div>
      <div style="display:flex;align-items:baseline;gap:10px;">
        <span style="font-size:30px;font-weight:700;letter-spacing:-.02em;">${fmt(SPX)}</span>
        <span style="font-size:13px;color:${SESSION_COLOR};font-weight:500;">${sign(SPX_CHANGE_PTS)} (${sign(SPX_CHANGE_PCT)}%)</span>
      </div>
      <div class="tiny" style="margin-top:2px;color:var(--red);">⚡ Only ${Math.round(FLIP_BUF)}pts above GEX flip (${GEX.flipPoint})</div>
    </div>
    <div class="divider"></div>
    <div><div class="label">SPY</div><div style="font-size:18px;font-weight:600;color:#94a3b8;">$${SPY}</div></div>
    <div class="divider"></div>
    <div style="display:flex;gap:20px;">
      ${[["OPEN",CANDLE.open,null],["HIGH",CANDLE.high,"var(--green)"],["LOW",CANDLE.low,"var(--red)"],["CLOSE",CANDLE.close,null],["VOL",CANDLE.volume,null],["AVG",CANDLE.avgVol,"var(--dim)"]].map(([l,v,c])=>`
        <div><div class="label">${l}</div><div style="font-size:12px;font-weight:500;color:${c||"#94a3b8"};">${fmt(v)}</div></div>`).join("")}
    </div>
    <div style="margin-left:auto;text-align:right;">
      <span class="tag ${SESSION_TAG}" style="font-size:11px;padding:4px 12px;">${SESSION_LABEL}</span>
      <div class="tiny" style="margin-top:3px;">${SESSION_NOTE}</div>
      <div class="tiny" style="color:var(--muted);margin-top:2px;">IV ${GEX.iv}% · HV ${GEX.hv}% · IVR ${GEX.ivRank}%</div>
    </div>`;

  document.querySelectorAll(".tab").forEach(t => {
    t.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
      document.querySelectorAll(".tabpanel").forEach(x=>x.classList.remove("active"));
      t.classList.add("active");
      document.getElementById("panel-"+t.dataset.tab).classList.add("active");
    });
  });

  // GEX alert banner
  const gexAlert = `
    <div class="gex-alert span3">
      <div style="font-size:10px;color:var(--red);font-weight:700;letter-spacing:.1em;margin-bottom:6px;">🚨 GEX REGIME ALERT — Updated May 18</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
        ${[
          ["Flip Point","7,345 ↑ from 6,739","var(--red)","Was 669pts below SPX"],
          ["SPX vs Flip",`Only ${Math.round(FLIP_BUF)}pts above`,"var(--red)","Critical edge of regime"],
          ["Put Wall","7,400 ↑ from 7,000","var(--yellow)","Now same as call wall"],
          ["Regime","EDGE — not safe yet","var(--yellow)","Below 7,345 = negative gamma"],
        ].map(([l,v,c,sub])=>`
          <div style="background:rgba(0,0,0,.2);border-radius:4px;padding:8px;">
            <div style="font-size:9px;color:var(--dim);margin-bottom:2px;">${l}</div>
            <div style="font-size:13px;font-weight:700;color:${c};margin-bottom:2px;">${v}</div>
            <div style="font-size:9px;color:var(--muted);">${sub}</div>
          </div>`).join("")}
      </div>
    </div>`;

  document.getElementById("panel-overview").innerHTML = `
  <div class="grid3">
    ${gexAlert}

    <div class="card ${CALL_WARN?"warn":"glow"}" style="padding:20px;">
      <div style="font-size:9px;color:var(--muted);letter-spacing:.15em;margin-bottom:10px;display:flex;justify-content:space-between;">
        <span>CALL SPREAD RISK</span>
        <span style="color:${CALL_WARN?"var(--yellow)":"var(--green)"};">${CALL_WARN?"🟡 WATCH":"🟢 HEALTHY"}</span>
      </div>
      ${gauge(CALL_BUF,CALL_BUF_PCT,500,"#fbbf24")}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;">
        <div class="cell" style="text-align:center;border-color:#2a1f00;"><div class="cell-label">SHORT CALL</div><div class="cell-val" style="color:var(--yellow);">${fmt(STRIKES.callShort)}</div></div>
        <div class="cell" style="text-align:center;"><div class="cell-label">LONG CALL</div><div class="cell-val" style="color:#94a3b8;">${fmt(STRIKES.callLong)}</div></div>
      </div>
      <div style="margin-top:10px;padding:8px;background:rgba(52,211,153,.04);border-radius:4px;border:1px solid rgba(52,211,153,.1);">
        <div style="font-size:10px;color:var(--green);line-height:1.5;">Call wall 7,400 = ceiling. Roll trigger: +${Math.round(7600-SPX)}pts to ~7,600</div>
      </div>
    </div>

    <div class="card safe" style="padding:20px;">
      <div style="font-size:9px;color:var(--muted);letter-spacing:.15em;margin-bottom:10px;display:flex;justify-content:space-between;">
        <span>PUT SPREAD</span>
        <div style="display:flex;gap:6px;align-items:center;"><span class="badge">ROLLED ↑</span><span style="color:var(--green);">✓ SAFE</span></div>
      </div>
      ${gauge(PUT_BUF,PUT_BUF_PCT,900,"#34d399")}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;">
        <div class="cell" style="text-align:center;border-color:#1e3a2a;"><div class="cell-label">SHORT PUT</div><div class="cell-val" style="color:var(--green);">${fmt(STRIKES.putShort)}</div></div>
        <div class="cell" style="text-align:center;"><div class="cell-label">LONG PUT</div><div class="cell-val" style="color:#94a3b8;">${fmt(STRIKES.putLong)}</div></div>
      </div>
      <div style="margin-top:10px;padding:8px;background:rgba(239,68,68,.04);border-radius:4px;border:1px solid rgba(239,68,68,.1);">
        <div style="font-size:10px;color:var(--red);line-height:1.5;">⚠️ Short put now in NEGATIVE gamma zone (below flip 7,345)</div>
      </div>
    </div>

    <div class="col-r">
      <div class="card glow" style="padding:14px;">
        <div class="micro" style="margin-bottom:10px;letter-spacing:.15em;">GREEKS ESTIMATE</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          ${[["DELTA","-0.10","#94a3b8"],["THETA/DAY","+24.1","var(--green)"],["VEGA","-91","var(--red)"],["IV%",`${GEX.iv}%`,"#94a3b8"]].map(([l,v,c])=>`
            <div class="cell"><div class="cell-label">${l}</div><div class="cell-val" style="font-size:14px;color:${c};">${v}</div></div>`).join("")}
        </div>
      </div>
      <div class="card" style="padding:14px;border-color:#3d1515;background:#0f0505;">
        <div class="micro" style="margin-bottom:8px;letter-spacing:.15em;">RECOMMENDATION</div>
        <div style="display:inline-block;padding:3px 10px;border-radius:3px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.2);color:var(--yellow);font-size:11px;font-weight:700;letter-spacing:.1em;margin-bottom:8px;">⚠️ MONITOR — GEX SHIFT</div>
        <div class="small">${REC}</div>
      </div>
      <div class="card glow" style="padding:14px;">
        <div class="micro" style="margin-bottom:10px;letter-spacing:.15em;">TIME DECAY</div>
        ${[["cd",CD_DTE,TOTAL_CD,"var(--blue)"],["td",TD_DTE,TOTAL_TD,"var(--purple)"]].map(([l,r,t,c])=>`
          <div style="margin-bottom:8px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <div class="pbar-track" style="flex:1;"><div class="pbar-fill" style="width:${((t-r)/t*100).toFixed(0)}%;background:${c};"></div></div>
              <span style="font-size:11px;color:${c};font-weight:600;min-width:36px;">${r}${l}</span>
            </div>
          </div>`).join("")}
        <div class="tiny">Theta earning ~$24.1/day</div>
      </div>
    </div>

    <div class="card glow span3" style="padding:18px;">
      <div class="micro" style="margin-bottom:12px;letter-spacing:.15em;">SPX JOURNEY — SINCE CONDOR OPENED</div>
      <div class="journey-bars">
        ${PRICE_HISTORY.map((item,i)=>{
          const min=7200,max=7550,h=((item.spx-min)/(max-min)*58+10).toFixed(0);
          const isLast=i===PRICE_HISTORY.length-1,isATH=item.spx===ATH_SPX;
          const bc=isLast?SESSION_COLOR:isATH?"#fbbf24":"#1e3a5f";
          const tc=isLast?SESSION_COLOR:isATH?"#fbbf24":"var(--vdim)";
          return `<div class="j-bar-wrap">
            <div class="j-bar-val" style="color:${tc};">${fmt(item.spx)}</div>
            <div class="j-bar" style="height:${h}px;background:${bc};"></div>
            <div class="j-bar-date">${item.date.replace("May ","")}</div>
          </div>`;
        }).join("")}
      </div>
      <div class="journey-stats">
        <div class="jstat">Opened: <span style="color:#94a3b8;">~${fmt(OPEN_SPX)}</span></div>
        <div class="jstat">ATH: <span style="color:var(--yellow);">${fmt(ATH_SPX)}</span></div>
        <div class="jstat">Today (SPX): <span style="color:${SESSION_COLOR};">${fmt(SPX)}</span></div>
        <div class="jstat">GEX Flip: <span style="color:var(--red);">${fmt(GEX.flipPoint)} (${Math.round(FLIP_BUF)}pts below)</span></div>
        <div class="jstat">To short call: <span style="color:var(--yellow);">${Math.round(CALL_BUF)}pts (${CALL_BUF_PCT}%)</span></div>
        <div class="jstat">To short put: <span style="color:var(--green);">${Math.round(PUT_BUF)}pts (${PUT_BUF_PCT}%)</span></div>
      </div>
    </div>

    <div class="card glow span3" style="padding:18px;">
      <div class="micro" style="margin-bottom:12px;letter-spacing:.15em;">${TIMESTAMP.split("  ")[0].toUpperCase()} — CANDLE ANALYSIS (SPX)</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr) 2fr;gap:10px;">
        ${[["OPEN",CANDLE.open,"#94a3b8","var(--border)"],["HIGH",CANDLE.high,"var(--green)","#1e3a2a"],["LOW",CANDLE.low,"var(--red)","#3d1515"],["CLOSE",CANDLE.close,SESSION_COLOR,SESSION==="bearish"?"#3d1515":"#1e3a2a"]].map(([l,v,c,b])=>`
          <div class="cell" style="border-color:${b};text-align:center;">
            <div class="cell-label">${l}</div><div class="cell-val" style="font-size:15px;color:${c};">${fmt(v)}</div>
          </div>`).join("")}
        <div class="cell">
          <div class="cell-label" style="margin-bottom:6px;">SESSION SUMMARY</div>
          <div class="small">${SESSION_SUMMARY}</div>
        </div>
      </div>
    </div>
  </div>`;

  document.getElementById("panel-levels").innerHTML = `
  <div class="grid2">
    <div class="card glow" style="padding:20px;">
      <div class="micro" style="margin-bottom:14px;letter-spacing:.15em;">KEY PRICE LEVELS (incl. GEX)</div>
      ${KEY_LEVELS.map(lv=>{
        const isCur=lv.type==="current",isStr=lv.type==="strike",isRes=lv.type==="resistance",isFlip=lv.type==="flip";
        const color=isCur?"var(--blue)":isFlip?"var(--red)":isStr?"var(--red)":isRes?"var(--yellow)":"var(--green)";
        const pct=((lv.price-6600)/(7900-6600)*100).toFixed(0);
        return `<div class="level-row ${isCur?"current":isFlip?"flip":""}">
          <div class="level-price" style="color:${color};">${fmt(lv.price)}</div>
          <div class="level-bar"><div class="lbar-track"><div class="lbar-fill" style="width:${pct}%;background:${color};"></div></div></div>
          <div class="level-label" style="color:${isCur?"var(--blue)":isFlip?"var(--red)":"var(--muted)"};">${lv.label}</div>
        </div>`;
      }).join("")}
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="card glow" style="padding:16px;">
        <div class="micro" style="margin-bottom:12px;letter-spacing:.15em;">SCENARIO ANALYSIS</div>
        ${SCENARIOS.map(s=>`
          <div style="margin-bottom:10px;padding:10px;background:var(--bg2);border-radius:4px;border:1px solid ${s.color}22;">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
              <span style="font-size:11px;color:${s.color};font-weight:600;">${s.label}</span>
              <span style="font-size:9px;color:var(--dim);">${s.impact}</span>
            </div>
            <div style="font-size:11px;color:var(--muted);line-height:1.5;">${s.desc}</div>
          </div>`).join("")}
      </div>
      <div class="card danger" style="padding:14px;">
        <div style="font-size:9px;color:var(--red);letter-spacing:.1em;margin-bottom:8px;">🚨 GEX STRUCTURE — UPDATED MAY 18</div>
        <div class="small" style="line-height:2;">
          Flip point: <span style="color:var(--red);font-weight:600;">${fmt(GEX.flipPoint)}</span> 🚨 was 6,739<br>
          SPX vs flip: <span style="color:var(--red);font-weight:600;">Only ${Math.round(FLIP_BUF)}pts above</span><br>
          Put wall: <span style="color:var(--yellow);font-weight:600;">${fmt(GEX.putWall)}</span> ↑ was 7,000<br>
          Call wall: <span style="color:var(--yellow);font-weight:600;">${fmt(GEX.callWall)}</span> unchanged<br>
          Regime: <span style="color:var(--yellow);font-weight:600;">EDGE — fragile</span><br>
          IV / HV: <span style="color:#94a3b8;font-weight:600;">${GEX.iv}% / ${GEX.hv}%</span>
        </div>
      </div>
      <div class="card glow" style="padding:14px;">
        <div style="font-size:9px;color:var(--blue);letter-spacing:.1em;margin-bottom:8px;">ROLL TRIGGER ZONE</div>
        <div class="small">If SPX breaks above <span style="color:var(--yellow);font-weight:600;">7,600</span> (${Math.round(7600-SPX)}pts), roll call to ${fmt(STRIKES.callShort+100)}/${fmt(STRIKES.callLong+100)}. If SPX breaks below <span style="color:var(--red);font-weight:600;">7,345</span> (flip), expect vol to amplify — monitor put side closely.</div>
      </div>
    </div>
  </div>`;

  document.getElementById("panel-news").innerHTML = `
  <div class="card glow" style="padding:20px;">
    <div class="micro" style="margin-bottom:14px;letter-spacing:.15em;">LATEST MARKET-MOVING NEWS</div>
    ${NEWS.map(item=>`
      <div class="news-row ${item.hot?"hot":""}">
        <div class="news-time">${item.time}</div>
        <div class="news-text ${item.hot?"hot-text":""}">${item.hot?"🔴 ":""}${item.text}</div>
        <span class="tag ${item.impact==="bullish"?"bull":item.impact==="bearish"?"bear":"neut"}">${item.impact.toUpperCase()}</span>
      </div>`).join("")}
  </div>`;

  document.getElementById("panel-calendar").innerHTML = `
  <div class="grid5" style="margin-bottom:14px;">
    ${CALENDAR.map(item=>{
      const ic=item.impact==="high"?"#ef4444":item.impact==="medium"?"#f59e0b":"#64748b";
      return `<div class="card" style="padding:14px;opacity:${item.done?.45:1};border-color:${item.impact==="high"?"#3d1515":"var(--border)"};background:${item.impact==="high"?"#0f0a0a":"var(--bg3)"};">
        <div style="font-size:9px;color:var(--dim);letter-spacing:.1em;margin-bottom:6px;">${item.day}</div>
        <div style="font-size:12px;color:${item.done?"var(--vdim)":"var(--text)"};font-weight:600;line-height:1.4;margin-bottom:8px;">${item.event}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="width:6px;height:6px;border-radius:50%;background:${ic};${item.impact==="high"?`box-shadow:0 0 6px ${ic};`:""}"></div>
          <span style="font-size:9px;color:${ic};">${item.impact.toUpperCase()}</span>
        </div>
        ${item.done?`<div style="font-size:9px;color:var(--vdim);margin-top:4px;">COMPLETE</div>`:""}
      </div>`;
    }).join("")}
  </div>
  <div class="card glow" style="padding:14px;">
    <div class="micro" style="margin-bottom:10px;letter-spacing:.15em;">FULL TIMELINE TO EXPIRY — ${EXPIRY.toUpperCase()}</div>
    <div class="grid3t">
      ${TIMELINE.map(e=>`
        <div class="tl-item" style="border:1px solid ${e.color}33;">
          <div style="font-size:11px;color:${e.color};font-weight:600;margin-bottom:2px;">${e.date}</div>
          <div style="font-size:10px;color:var(--muted);">${e.label}</div>
        </div>`).join("")}
    </div>
  </div>`;

  document.getElementById("footer-right").textContent =
    `PUT ${STRIKES.putLong}/${STRIKES.putShort} · CALL ${STRIKES.callShort}/${STRIKES.callLong} · EXP ${EXPIRY} · SPX ${fmt(SPX)} · FLIP ${fmt(GEX.flipPoint)}`;
});
</script>

<div id="header" class="header"></div>
<div id="pricebar" class="pricebar"></div>
<div class="tabbar">
  <button class="tab active" data-tab="overview">OVERVIEW</button>
  <button class="tab"        data-tab="levels">LEVELS</button>
  <button class="tab"        data-tab="news">NEWS</button>
  <button class="tab"        data-tab="calendar">CALENDAR</button>
</div>
<div class="content">
  <div id="panel-overview" class="tabpanel active"></div>
  <div id="panel-levels"   class="tabpanel"></div>
  <div id="panel-news"     class="tabpanel"></div>
  <div id="panel-calendar" class="tabpanel"></div>
</div>
<div class="footer">
  <span style="font-size:9px;color:#1e293b;letter-spacing:.1em;">FOR EDUCATIONAL PURPOSES ONLY — NOT FINANCIAL ADVICE</span>
  <span id="footer-right" style="font-size:9px;color:#334155;"></span>
</div>
</body>
</html>
