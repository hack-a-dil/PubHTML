<!DOCTYPE html>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#080c14; --bg2:#0a0f1a; --bg3:#0d1420; --border:#1a2332;
  --text:#e2e8f0; --muted:#64748b; --dim:#475569; --vdim:#334155;
  --green:#34d399; --yellow:#fbbf24; --red:#f87171; --blue:#38bdf8;
  --purple:#818cf8; --orange:#fb923c;
  --font:'IBM Plex Mono','Courier New',monospace;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.pricebar{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.tabbar{background:var(--bg);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px;}
.content{padding:20px 24px;}
.footer{padding:10px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;margin-top:24px;}
.divider{width:1px;height:44px;background:var(--border);flex-shrink:0;}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;}
.card.glow{box-shadow:0 0 20px rgba(56,189,248,0.05);}
.card.warn{box-shadow:0 0 24px rgba(251,191,36,0.15);border-color:#3d2e00!important;}
.card.safe{box-shadow:0 0 20px rgba(52,211,153,0.06);}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.grid3t{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.span3{grid-column:1/-1;}
.col-r{display:flex;flex-direction:column;gap:14px;}
.tab{padding:8px 16px;cursor:pointer;font-size:11px;letter-spacing:.1em;font-weight:500;border-bottom:2px solid transparent;color:var(--muted);transition:all .2s;font-family:var(--font);background:none;border-left:none;border-right:none;border-top:none;}
.tab:hover{color:#94a3b8;}.tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.tabpanel{display:none;}.tabpanel.active{display:block;animation:si .35s ease-out;}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:.08em;font-family:var(--font);}
.bull{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.2);}
.bear{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.neut{background:rgba(148,163,184,.1);color:#94a3b8;border:1px solid rgba(148,163,184,.15);}
.ah-bear{background:rgba(251,146,60,.15);color:var(--orange);border:1px solid rgba(251,146,60,.25);}
.badge{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2);border-radius:4px;padding:2px 8px;font-size:9px;color:var(--blue);letter-spacing:.08em;}
.badge-warn{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:4px;padding:2px 8px;font-size:9px;color:var(--red);letter-spacing:.08em;}
.badge-green{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2);border-radius:4px;padding:2px 8px;font-size:9px;color:var(--green);letter-spacing:.08em;}
.label{font-size:9px;color:var(--dim);letter-spacing:.12em;margin-bottom:2px;}
.micro{font-size:9px;color:var(--muted);letter-spacing:.1em;}
.tiny{font-size:10px;color:var(--muted);}
.small{font-size:11px;color:var(--muted);line-height:1.6;}
.pbar-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.pbar-fill{height:100%;border-radius:3px;}
.lbar-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px;}
.lbar-fill{height:100%;border-radius:2px;opacity:.7;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes si{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cell{background:var(--bg2);border-radius:4px;padding:8px;border:1px solid var(--border);}
.cell-label{font-size:9px;color:var(--dim);margin-bottom:2px;}
.cell-val{font-size:15px;font-weight:600;}
.news-row{display:flex;align-items:flex-start;gap:14px;padding:13px 10px;border-bottom:1px solid #0f1923;}
.news-row.hot{background:rgba(239,68,68,.02);}
.news-time{font-size:10px;color:var(--vdim);min-width:52px;flex-shrink:0;}
.news-text{flex:1;font-size:12px;color:var(--muted);line-height:1.5;}
.news-text.hot-text{color:#cbd5e1;}
.level-row{display:flex;align-items:center;gap:10px;padding:9px;border-radius:4px;border:1px solid transparent;}
.level-row.current{background:rgba(56,189,248,.05);border-color:rgba(56,189,248,.15)!important;}
.level-row.flip{background:rgba(52,211,153,.05);border-color:rgba(52,211,153,.15)!important;}
.level-row.wall{background:rgba(251,191,36,.05);border-color:rgba(251,191,36,.15)!important;}
.level-price{width:64px;font-size:14px;font-weight:700;text-align:right;}
.level-bar{flex:1;}
.level-label{font-size:11px;width:160px;}
.journey-bars{display:flex;align-items:flex-end;gap:6px;height:72px;margin-bottom:6px;}
.j-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.j-bar{width:100%;border-radius:2px 2px 0 0;}
.j-bar-date{font-size:9px;color:var(--vdim);}
.journey-stats{display:flex;justify-content:space-between;padding:8px;background:var(--bg2);border-radius:4px;border:1px solid var(--border);flex-wrap:wrap;gap:8px;}
@media(max-width:900px){.grid3{grid-template-columns:1fr 1fr;}.grid4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.grid3,.grid2,.grid4{grid-template-columns:1fr;}}
</style>
</head>

function gaugeArc(pct){
  const r=52,cx=70,cy=68,s=-210,e=-210+240*Math.min(pct,1),rad=a=>a*Math.PI/180;
  const x1=cx+r*Math.cos(rad(s)),y1=cy+r*Math.sin(rad(s));
  const x2=cx+r*Math.cos(rad(e)),y2=cy+r*Math.sin(rad(e));
  return `M ${x1} ${y1} A ${r} ${r} 0 ${e-s>180?1:0} 1 ${x2} ${y2}`;
}
function gauge(buf,bufPct,maxPts,color){
  const pct=Math.min(buf/maxPts,1);
  return `<svg width="150" height="108" viewBox="0 0 140 102" style="display:block;margin:0 auto;">
    <path d="${gaugeArc(1)}" fill="none" stroke="#1a2332" stroke-width="8" stroke-linecap="round"/>
    <path d="${gaugeArc(pct)}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" style="filter:drop-shadow(0 0 5px ${color})"/>
    <text x="70" y="51" text-anchor="middle" fill="${color}" font-size="22" font-weight="700" font-family="IBM Plex Mono,monospace">${Math.round(buf)}</text>
    <text x="70" y="69" text-anchor="middle" fill="${color}" font-size="14" font-weight="600" font-family="IBM Plex Mono,monospace" opacity="0.9">${bufPct}%</text>
    <text x="70" y="84" text-anchor="middle" fill="#475569" font-size="8" font-family="IBM Plex Mono,monospace">PTS / % TO SHORT STRIKE</text>
  </svg>`;
}

        </div>
        ${item.done?`<div style="font-size:9px;color:var(--green);margin-top:4px;">✓ COMPLETE</div>`:""}
      </div>`;
    }).join("")}
  </div>
  <div class="card glow" style="padding:14px;">
    <div class="micro" style="margin-bottom:10px;letter-spacing:.15em;">TIMELINE TO EXPIRY — ${EXPIRY.toUpperCase()}</div>
    <div class="grid3t">
      ${TIMELINE.map(e=>`
        <div style="padding:10px;background:var(--bg2);border-radius:4px;border:1px solid ${e.color}33;">
          <div style="font-size:11px;color:${e.color};font-weight:600;margin-bottom:2px;">${e.date}</div>
          <div style="font-size:10px;color:var(--muted);">${e.label}</div>
        </div>`).join("")}
    </div>
  </div>`;

  const sColor=s=>s==="bullish"?"#34d399":s==="bearish"?"#f87171":"#94a3b8";
  document.getElementById("panel-history").innerHTML=`
  <div style="display:flex;flex-direction:column;gap:16px;">
    <div class="card glow" style="padding:20px;">
      <div class="micro" style="margin-bottom:16px;letter-spacing:.15em;">P&L SUMMARY</div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;">
        ${[
          ["Initial Credit",  `$${INITIAL_CREDIT.toFixed(2)}`,                               "#34d399", `Collected on open ${CONDOR_OPEN_DATE}`],
          ["Roll Credits",    `+$${TOTAL_CREDITS.toFixed(2)}`,                               "#34d399", `${ROLL_LOG.filter(r=>r.side!=="OPEN").length} rolls · $${(TOTAL_CREDITS*100).toFixed(0)}/contract`],
          ["Total Collected", `$${TOTAL_COLLECTED.toFixed(2)}`,                              "#34d399", `$${(TOTAL_COLLECTED*100).toFixed(0)}/contract`],
          ["Current Mark",    `$${MARK.toFixed(2)}`,                                         "#94a3b8", `Update at each close`],
          ["Unrealized P&L",  `${UNREALIZED_PL>=0?"+":""}$${UNREALIZED_PL.toFixed(2)}`,     PL_COLOR,  UNREALIZED_PL>=0?`+${PL_PCT}% · profitable`:`${PL_PCT}% · ~${THETA_TO_BE}cd to BE`],
        ].map(([l,v,c,sub])=>`
          <div style="background:var(--bg2);border-radius:4px;padding:12px;border:1px solid ${c==="#34d399"?"rgba(52,211,153,.2)":c===PL_COLOR&&UNREALIZED_PL<0?"rgba(248,113,113,.2)":"var(--border)"};">
            <div style="font-size:9px;color:var(--dim);margin-bottom:4px;">${l}</div>
            <div style="font-size:16px;font-weight:700;color:${c};margin-bottom:3px;">${v}</div>
            <div style="font-size:9px;color:var(--muted);">${sub}</div>
          </div>`).join("")}
      </div>
    </div>

    <div class="card glow" style="padding:20px;">
      <div class="micro" style="margin-bottom:16px;letter-spacing:.15em;">DAILY PRICE & BUFFER LOG — ROLLING 30-DAY WINDOW (${HISTORY_WINDOW.length} of ${HISTORY_LOG.length} sessions)</div>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:11px;">
          <thead><tr style="border-bottom:1px solid #1a2332;">
            ${["DATE","SPX","CALL BUF","PUT BUF","GEX FLIP","SESSION","NOTE"].map(h=>`
              <th style="padding:8px 12px;text-align:left;font-size:9px;color:var(--dim);letter-spacing:.1em;font-weight:500;">${h}</th>`).join("")}
          </tr></thead>
          <tbody>
            ${[...HISTORY_WINDOW].reverse().map((row,i)=>{
              const isToday=i===0;
              const cc=row.callBuf===null?"#334155":bufColor(row.callBuf);
              const pc=row.putBuf===null?"#334155":bufColor(row.putBuf);
              const fc=row.gexFlip===null?"#334155":row.gexFlip>7000?"#fbbf24":row.gexFlip>6000?"#34d399":"#38bdf8";
              return `<tr style="border-bottom:1px solid #0f1923;background:${isToday?"rgba(56,189,248,.04)":"transparent"};">
                <td style="padding:9px 12px;color:${isToday?"var(--blue)":"#94a3b8"};font-weight:${isToday?600:400};">${row.date}${isToday?" ◀":""}</td>
                <td style="padding:9px 12px;color:#e2e8f0;font-weight:600;">${fmt(row.spx)}</td>
                <td style="padding:9px 12px;color:${cc};font-weight:500;">${row.callBuf!==null?row.callBuf+"pts":"—"}</td>
                <td style="padding:9px 12px;color:${pc};font-weight:500;">${row.putBuf!==null?row.putBuf+"pts":"—"}</td>
                <td style="padding:9px 12px;color:${fc};">${row.gexFlip!==null?fmt(row.gexFlip):"—"}</td>
                <td style="padding:9px 12px;"><div style="display:flex;align-items:center;gap:6px;">
                  <div style="width:6px;height:6px;border-radius:50%;background:${sColor(row.session)};flex-shrink:0;"></div>
                  <span style="color:${sColor(row.session)};font-size:10px;">${row.session.toUpperCase()}</span>
                </div></td>
                <td style="padding:9px 12px;color:var(--muted);font-size:10px;max-width:260px;">${row.note}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="card glow" style="padding:20px;">
      <div class="micro" style="margin-bottom:16px;letter-spacing:.15em;">ROLL LOG</div>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:11px;">
          <thead><tr style="border-bottom:1px solid #1a2332;">
            ${["DATE","SIDE","FROM","TO","DIRECTION","CREDIT","NOTE"].map(h=>`
              <th style="padding:8px 12px;text-align:left;font-size:9px;color:var(--dim);letter-spacing:.1em;font-weight:500;">${h}</th>`).join("")}
          </tr></thead>
          <tbody>
            ${ROLL_LOG.map(row=>{
              const isOpen=row.side==="OPEN";
              const sc=isOpen?"var(--blue)":row.side==="PUT"?"var(--green)":"var(--yellow)";
              const dc=row.dir==="—"?"var(--muted)":row.dir.includes("↑")?"var(--green)":"var(--blue)";
              return `<tr style="border-bottom:1px solid #0f1923;background:${isOpen?"rgba(56,189,248,.04)":"transparent"};">
                <td style="padding:9px 12px;color:${isOpen?"var(--blue)":"#94a3b8"};font-weight:${isOpen?600:400};">${row.date}</td>
                <td style="padding:9px 12px;"><span style="color:${sc};font-weight:600;font-size:10px;">${row.side}</span></td>
                <td style="padding:9px 12px;color:var(--dim);font-size:10px;">${row.from}</td>
                <td style="padding:9px 12px;color:#e2e8f0;font-weight:600;font-size:10px;">${row.to}</td>
                <td style="padding:9px 12px;color:${dc};">${row.dir}</td>
                <td style="padding:9px 12px;color:var(--green);font-weight:600;">${row.credit}</td>
                <td style="padding:9px 12px;color:var(--muted);font-size:10px;">${row.note}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
      <div style="margin-top:12px;padding:10px;background:var(--bg2);border-radius:4px;border:1px solid var(--border);display:flex;gap:24px;flex-wrap:wrap;">
        <div><div style="font-size:9px;color:var(--dim);margin-bottom:2px;">TOTAL COLLECTED</div>
          <div style="font-size:14px;color:var(--green);font-weight:700;">$${TOTAL_COLLECTED.toFixed(2)} <span style="font-size:10px;color:var(--muted);">($${(TOTAL_COLLECTED*100).toFixed(0)}/contract)</span></div>
        </div>
        <div><div style="font-size:9px;color:var(--dim);margin-bottom:2px;">TOTAL ROLLS</div>
          <div style="font-size:14px;color:var(--blue);font-weight:700;">${ROLL_LOG.filter(r=>r.side!=="OPEN").length} <span style="font-size:10px;color:var(--muted);">(${ROLL_LOG.filter(r=>r.side==="PUT").length} put · ${ROLL_LOG.filter(r=>r.side==="CALL").length} call)</span></div>
        </div>
        <div><div style="font-size:9px;color:var(--dim);margin-bottom:2px;">CURRENT STRIKES</div>
          <div style="font-size:12px;color:#e2e8f0;font-weight:600;">${STRIKES.putLong}/${STRIKES.putShort} · ${STRIKES.callShort}/${STRIKES.callLong}</div>
        </div>
        <div><div style="font-size:9px;color:var(--dim);margin-bottom:2px;">UNREALIZED P&L</div>
          <div style="font-size:14px;color:${PL_COLOR};font-weight:700;">${UNREALIZED_PL>=0?"+":""}$${UNREALIZED_PL.toFixed(2)} <span style="font-size:10px;color:var(--muted);">(${PL_PCT}%)</span></div>
        </div>
      </div>
    </div>

    <div class="card glow" style="padding:16px;">
      <div class="micro" style="margin-bottom:10px;letter-spacing:.15em;">POSITION SUMMARY</div>
      <div class="grid4">
        ${[
          ["Original Condor","6235/6285 · 7250/7300","#64748b","Closed at loss May 5"],
          ["Current Condor",`${STRIKES.putLong}/${STRIKES.putShort} · ${STRIKES.callShort}/${STRIKES.callLong}`,"var(--blue)",`${ROLL_LOG.filter(r=>r.side!=="OPEN").length} rolls total`],
          ["Expiry",EXPIRY,"var(--blue)",`${CD_DTE}cd / ${TD_DTE}td remaining`],
          ["Days Tracked",`${HISTORY_LOG.length} sessions`,"var(--green)",`Since ${CONDOR_OPEN_DATE}, 2026`],
        ].map(([l,v,c,sub])=>`
          <div><div style="font-size:9px;color:var(--dim);margin-bottom:3px;">${l}</div>
          <div style="font-size:12px;font-weight:600;color:${c};margin-bottom:2px;">${v}</div>
          <div style="font-size:9px;color:var(--muted);">${sub}</div></div>`).join("")}
      </div>
    </div>
  </div>`;

  document.getElementById("panel-chart").innerHTML=`
  <div style="display:flex;flex-direction:column;gap:16px;">
    <div class="grid4">
      ${[
        ["Short Call",fmt(STRIKES.callShort),bufColor(CALL_BUF),`Buffer: ${Math.round(CALL_BUF)}pts (${CALL_BUF_PCT}%)`],
        ["Long Call", fmt(STRIKES.callLong), "#94a3b8","Protection ceiling"],
        ["Short Put", fmt(STRIKES.putShort), bufColor(PUT_BUF),`Buffer: ${Math.round(PUT_BUF)}pts (${PUT_BUF_PCT}%)`],
        ["Long Put",  fmt(STRIKES.putLong),  "#94a3b8","Protection floor"],
      ].map(([l,v,c,sub])=>`
        <div class="card glow" style="padding:12px;">
          <div style="font-size:9px;color:var(--dim);margin-bottom:3px;">${l}</div>
          <div style="font-size:18px;font-weight:700;color:${c};margin-bottom:2px;">${v}</div>
          <div style="font-size:9px;color:var(--muted);">${sub}</div>
        </div>`).join("")}
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
      ${[
        ["Call Wall 🧱",     fmt(GEX.callWall),           "var(--yellow)", `+${Math.round(CALL_WALL_BUF)}pts · tested as support today`],
        ["GEX Flip",         fmt(GEX.flipPoint),          "var(--green)",  `${Math.round(FLIP_BUF)}pts below close`],
        ["Expected ↑",       fmt(GEX.expectedMoveUp),     "#94a3b8",       `Short call ${Math.abs(Math.round(EM_CALL_BUF))}pts above this ✓`],
        ["AH Implied",       fmt(SPX_AH),                 "var(--orange)", `ES ${fmt(SPX_AH)} · +${Math.round(SPX_AH-SPX)}pts`],
      ].map(([l,v,c,sub])=>`
        <div class="card" style="padding:10px;border-color:${c}33;">
          <div style="font-size:9px;color:var(--dim);margin-bottom:3px;">${l}</div>
          <div style="font-size:15px;font-weight:700;color:${c};margin-bottom:2px;">${v}</div>
          <div style="font-size:9px;color:var(--muted);">${sub}</div>
        </div>`).join("")}
    </div>
    <div class="card glow" style="padding:0;overflow:hidden;border-radius:8px;">
      <div style="padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:10px;"><div class="dot"></div>
          <span style="font-size:11px;color:var(--blue);font-weight:600;letter-spacing:.08em;">SPX500 LIVE CHART — TradingView</span>
        </div>
        <span style="font-size:9px;color:var(--green);">● Live data</span>
      </div>
      <div class="tradingview-widget-container" style="height:520px;width:100%;">
        <div class="tradingview-widget-container__widget" style="height:100%;width:100%;"></div>
      </div>
    </div>
  </div>`;

  setTimeout(()=>{
    const c=document.querySelector(".tradingview-widget-container__widget");
    if(!c)return;
    const s=document.createElement("script");
    s.type="text/javascript";
    s.src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
    s.async=true;
    s.innerHTML=JSON.stringify({
      autosize:true,symbol:"SPX500",interval:"5",timezone:"America/New_York",
      theme:"dark",style:"1",locale:"en",backgroundColor:"#080c14",
      gridColor:"rgba(26,35,50,0.6)",hide_top_toolbar:false,hide_legend:false,
      save_image:false,hide_volume:false,support_host:"https://www.tradingview.com"
    });
    c.appendChild(s);
  },100);

  document.getElementById("footer-right").textContent=
    `PUT ${STRIKES.putLong}/${STRIKES.putShort} · CALL ${STRIKES.callShort}/${STRIKES.callLong} · EXP ${EXPIRY} · SPX ${fmt(SPX)} · AH ~${fmt(IMPLIED_OPEN)} · FLIP ${fmt(GEX.flipPoint)}`;
});
</script>

<div id="header" class="header"></div>
<div id="pricebar" class="pricebar"></div>
<div class="tabbar">
  <button class="tab active" data-tab="overview">OVERVIEW</button>
  <button class="tab"        data-tab="levels">LEVELS</button>
  <button class="tab"        data-tab="news">NEWS</button>
  <button class="tab"        data-tab="calendar">CALENDAR</button>
  <button class="tab"        data-tab="history">HISTORY</button>
  <button class="tab"        data-tab="chart">LIVE CHART</button>
</div>
<div class="content">
  <div id="panel-overview"  class="tabpanel active"></div>
  <div id="panel-levels"    class="tabpanel"></div>
  <div id="panel-news"      class="tabpanel"></div>
  <div id="panel-calendar"  class="tabpanel"></div>
  <div id="panel-history"   class="tabpanel"></div>
  <div id="panel-chart"     class="tabpanel"></div>
</div>
<div class="footer">
  <span style="font-size:9px;color:#1e293b;letter-spacing:.1em;">FOR EDUCATIONAL PURPOSES ONLY — NOT FINANCIAL ADVICE</span>
  <span id="footer-right" style="font-size:9px;color:#334155;"></span>
</div>
</body>
</html>
